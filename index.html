<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>แบบทดสอบปลายภาคเรียนที่ 1 ปีการศึกษา 2569 — ป.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --brand:#4f46e5;
    --brand2:#7c3aed;
    --hl:#fef3c7;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Sarabun','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    padding-bottom:110px;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;
    padding:22px 18px 20px;
    box-shadow:0 6px 22px rgba(79,70,229,.28);
  }
  header h1{margin:0;font-size:20px;font-weight:700;line-height:1.45;}
  header p{margin:6px 0 0;font-size:14px;opacity:.92;}

  /* ---------- Tabs ---------- */
  .tabs{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    display:flex;gap:8px;overflow-x:auto;
    padding:10px 12px;
    scrollbar-width:thin;
  }
  .tabs::-webkit-scrollbar{height:6px;}
  .tabs::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;}
  .tab{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#fff;color:var(--ink);
    padding:8px 15px;border-radius:999px;
    font-size:15px;font-family:inherit;font-weight:600;
    cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,box-shadow .15s,transform .1s;
  }
  .tab:hover{background:#eef2ff;}
  .tab:active{transform:scale(.97);}
  .tab.active{
    background:var(--brand);color:#fff;border-color:var(--brand);
    box-shadow:0 3px 12px rgba(79,70,229,.38);
  }

  /* ---------- Content ---------- */
  main{max-width:880px;margin:0 auto;padding:16px 14px 40px;}
  .subject-title{
    font-size:22px;font-weight:700;margin:6px 0 4px;
    color:#312e81;
  }
  .subject-desc{
    margin:0 0 14px;font-size:14px;color:var(--muted);
    background:#eef2ff;border-radius:10px;padding:9px 13px;
    border-left:4px solid var(--brand);
  }
  .section{margin-bottom:10px;}
  .section-title{
    background:#eef2ff;color:#3730a3;
    border-left:5px solid var(--brand);
    padding:10px 14px;border-radius:8px;
    font-size:16px;font-weight:700;
    margin:22px 0 12px;line-height:1.6;
  }

  .item{
    background:var(--card);
    border-radius:14px;
    padding:13px 15px;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  }
  .item-head{display:flex;gap:9px;align-items:flex-start;font-weight:600;font-size:16.5px;}
  .num{color:var(--brand);font-weight:700;flex:0 0 auto;min-width:22px;}
  .item-text{flex:1 1 auto;}

  .play-all{
    flex:0 0 auto;
    font-family:inherit;font-size:12.5px;font-weight:600;
    border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;
    border-radius:999px;padding:3px 10px;cursor:pointer;
    white-space:nowrap;margin-left:auto;
    transition:background .15s,transform .1s;
  }
  .play-all:hover{background:#e0e7ff;}
  .play-all:active{transform:scale(.95);}

  .opts{margin:8px 0 0;padding:0;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    padding:7px 10px;border-radius:10px;margin-top:4px;
    transition:background .15s;
  }
  .opt:hover{background:#f8fafc;}
  .opt .lbl{color:var(--brand);font-weight:700;flex:0 0 auto;min-width:22px;}
  .opt-text{flex:1 1 auto;}

  /* ---------- Matching & Word Bank ---------- */
  .matching-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    background:#fff;
    border-radius:14px;
    padding:16px;
    box-shadow:0 1px 3px rgba(16,24,40,.07);
    margin-top:12px;
  }
  .match-col{display:flex;flex-direction:column;gap:12px;}
  .match-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 12px;border-radius:10px;background:#f8fafc;
    border:1px solid var(--line);
  }
  .match-num{font-weight:700;color:var(--brand);min-width:20px;}
  .match-img{
    font-size:28px;text-align:center;width:100%;height:60px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;border-radius:8px;border:1px dashed #cbd5e1;
  }
  .wordbank-container{
    display:flex;flex-wrap:wrap;gap:10px;
    background:#fff;border-radius:14px;padding:16px;
    box-shadow:0 1px 3px rgba(16,24,40,.07);
    margin-top:12px;
  }
  .word-chip{
    background:#eef2ff;color:#3730a3;
    border:1px solid #c7d2fe;border-radius:999px;
    padding:6px 16px;font-weight:600;font-size:16px;
    cursor:pointer;transition:background .15s,transform .1s;
  }
  .word-chip:hover{background:#e0e7ff;}
  .word-chip:active{transform:scale(.96);}

  /* ---------- Clickable / TTS ---------- */
  .tts{
    cursor:pointer;
    border-radius:7px;
    padding:1px 5px;
    margin:-1px -5px;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
    transition:background .15s,box-shadow .15s;
  }
  .tts:hover{background:#eef2ff;}
  .tts:active{background:#e0e7ff;}
  .tts.speaking{
    background:var(--hl);
    box-shadow:inset 0 0 0 2px #fbbf24;
  }
  .tts.nospeak{
    cursor:help;
    background:#f3f4f6;
    color:#9ca3af;
    text-decoration:line-through;
    text-decoration-color:#d1d5db;
  }
  .tts.nospeak:hover{background:#f3f4f6;}

  /* Section title clickable */
  .section-title.tts{
    cursor:pointer;
    transition:background .15s,box-shadow .15s;
  }
  .section-title.tts:hover{background:#e0e7ff;}
  .section-title.tts.speaking{
    background:var(--hl);
    box-shadow:inset 0 0 0 2px #fbbf24;
  }

  /* Header clickable */
  header .tts{cursor:pointer;}
  header .tts:hover{background:rgba(255,255,255,.18);}
  header .tts.speaking{background:rgba(254,243,199,.35);box-shadow:inset 0 0 0 2px #fbbf24;}

  /* Subject title clickable */
  .subject-title.tts{cursor:pointer;transition:background .15s;}
  .subject-title.tts:hover{background:#e0e7ff;}
  .subject-title.tts.speaking{background:var(--hl);box-shadow:inset 0 0 0 2px #fbbf24;}

  /* ---------- Passage ---------- */
  .passage{
    background:#fffdf5;
    border:1px dashed #fbbf24;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .passage-title{font-weight:700;color:#b45309;margin-bottom:6px;font-size:15px;}
  .passage-text{margin:0;font-size:17px;}

  .plain-line{
    background:#fff;border-radius:12px;padding:11px 15px;margin:0 0 10px;
    box-shadow:0 1px 3px rgba(16,24,40,.06);
  }

  .tf-mark{
    flex:0 0 auto;font-size:13px;color:#b45309;background:#fef3c7;
    border-radius:8px;padding:2px 9px;font-weight:700;white-space:nowrap;
    margin-left:6px;
  }

  /* ---------- Control bar ---------- */
  .ctrlbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    box-shadow:0 -4px 18px rgba(16,24,40,.07);
  }
  .ctrlbar button{
    font-family:inherit;font-size:15px;font-weight:600;
    border:none;border-radius:999px;padding:9px 18px;cursor:pointer;
    background:#ef4444;color:#fff;transition:filter .15s,transform .1s;
  }
  .ctrlbar button:hover{filter:brightness(1.08);}
  .ctrlbar button:active{transform:scale(.97);}
  .ctrlbar label{
    font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;
  }
  .ctrlbar select{
    font-family:inherit;font-size:14px;padding:6px 8px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  #voiceInfo{font-size:13px;color:#b91c1c;margin-left:auto;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);
    background:#111827;color:#fff;padding:11px 18px;border-radius:12px;
    font-size:14px;max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  #toast.show{opacity:.96;transform:translate(-50%,0);}

  @media (max-width:480px){
    header h1{font-size:17px;}
    .subject-title{font-size:19px;}
    .item-head{font-size:16px;}
    .passage-text{font-size:16px;}
    .matching-grid{grid-template-columns: 1fr;}
  }
</style>
</head>

/* =========================================================
   ระบบอ่านออกเสียง (อัปเกรด — เลือกเสียงธรรมชาติคุณภาพสูงสุด)
   ========================================================= */
const synth = window.speechSynthesis || null;
let voices = [];
let currentRate = 1;             // ความเร็วเริ่มต้นของ slider (ใช้กับผู้ใช้ที่ปรับ)
let bestThaiVoice = null;
let bestEnglishVoice = null;

/* ---- เลือกเสียงที่ดีที่สุด ---- */
function pickBestVoice(langPrefix){
  if(!synth) return null;
  const list = (voices && voices.length) ? voices : (synth.getVoices() || []);
  if(!list.length) return null;

  const isThai = langPrefix === 'th';
  const preferredNames = isThai
    ? ['Google ไทย','Google Thai','Microsoft Pattara','Microsoft Premwadee','Kanya','Pattara','Th-TH','Thai']
    : ['Google US English','Google UK English','Microsoft David','Microsoft Zira','Microsoft Mark',
       'Alex','Samantha','Daniel','Karen','Moira','Tessa','en-US','en-GB','en-AU','English'];

  // 1) หาชื่อที่ต้องการ + lang ตรง + เป็น local (คุณภาพสูง)
  for(const name of preferredNames){
    const found = list.find(v =>
      (v.lang && v.lang.toLowerCase().startsWith(langPrefix)) &&
      (v.name && v.name.toLowerCase().includes(name.toLowerCase()))
    );
    if(found) return found;
  }
  // 2) หา lang ตรง + local
  let v = list.find(x => x.lang && x.lang.toLowerCase().startsWith(langPrefix) && x.localService);
  if(v) return v;
  // 3) หา lang ตรง
  v = list.find(x => x.lang && x.lang.toLowerCase().startsWith(langPrefix));
  if(v) return v;
  // 4) หาจากชื่อ
  for(const name of preferredNames){
    const found = list.find(v => v.name && v.name.toLowerCase().includes(name.toLowerCase()));
    if(found) return found;
  }
  return null;
}

function refreshVoices(){
  if(!synth) return;
  try { voices = synth.getVoices() || []; } catch(e){ voices = []; }
  bestThaiVoice    = pickBestVoice('th');
  bestEnglishVoice = pickBestVoice('en');
  updateVoiceInfo();
}

function updateVoiceInfo(){
  const info = document.getElementById('voiceInfo');
  if(!synth){ info.textContent = '⚠️ เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง'; return; }

  const parts = [];
  if(bestThaiVoice){
    const n = bestThaiVoice.name.split('(')[0].split('–')[0].trim();
    parts.push('🇹🇭 ' + n);
  } else {
    parts.push('🇹🇭 ⚠️ ไม่พบเสียงไทย');
  }
  if(bestEnglishVoice){
    const n = bestEnglishVoice.name.split('(')[0].split('–')[0].trim();
    parts.push('🇬🇧 ' + n);
  }
  info.textContent = '🔊 ' + parts.join(' · ');
}

/* ---- อ่านออกเสียง ---- */
function speak(text, node){
  if(!synth){ showToast('⚠️ เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง'); return; }
  if(!text || !text.trim()) return;

  try { synth.cancel(); } catch(e){}

  document.querySelectorAll('.tts.speaking').forEach(n => n.classList.remove('speaking'));

  const u = new SpeechSynthesisUtterance(text);
  const isThai = /[\u0E00-\u0E7F]/.test(text);

  if(isThai){
    u.lang = 'th-TH';
    if(bestThaiVoice) u.voice = bestThaiVoice;
    u.rate  = currentRate * 0.92;    // ภาษาไทยใช้ความเร็วค่อนข้างช้า ให้ฟังชัด
    u.pitch = 1.0;
  } else {
    u.lang = 'en-US';
    if(bestEnglishVoice) u.voice = bestEnglishVoice;
    u.rate  = currentRate * 0.85;    // ภาษาอังกฤษใช้ความเร็ว 0.8-0.85 เหมือนคนพูดจริง
    u.pitch = 1.0;
  }

  const clear = () => { if(node) node.classList.remove('speaking'); };
  u.onend = clear;
  u.onerror = clear;

  if(node) node.classList.add('speaking');

  setTimeout(() => { try { synth.speak(u); } catch(e){} }, 60);
}

function stopSpeaking(){
  if(!synth) return;
  try { synth.cancel(); } catch(e){}
  document.querySelectorAll('.tts.speaking').forEach(n => n.classList.remove('speaking'));
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* =========================================================
   สร้างหน้าเว็บ
   ========================================================= */
const contentEl = document.getElementById('content');
const tabsEl = document.getElementById('tabs');
const LABELS = ['ก','ข','ค','ง','จ'];

let currentIndex = 0;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}

function makeTTS(node, text){
  node.classList.add('tts');
  node.setAttribute('data-speak', text);
  node.setAttribute('title', 'แตะเพื่อฟังเสียงอ่าน');
  return node;
}

/* สร้างข้อความรวมของข้อสอบ (คำถาม + ตัวเลือก) */
function buildFullQuestionText(item, idx, exam, secType){
  if(secType === 'tf'){
    return 'ข้อ ' + (idx + 1) + ' ' + item.text;
  }
  const parts = ['ข้อ ' + (idx + 1), item.text];
  if(item.options && item.options.length){
    item.options.forEach((opt, i) => {
      const isSingleLatin = /^[A-Za-z]{1,2}$/.test(opt.trim());
      if(exam.skipLetterRead && isSingleLatin){
        return; // ข้ามตัวอักษรเดี่ยวในวิชาอังกฤษ
      }
      parts.push((LABELS[i] || '') + ' ' + opt);
    });
  }
  return parts.join(' ');
}

function renderTabs(){
  tabsEl.innerHTML = '';
  EXAMS.forEach((ex, i) => {
    const b = el('button', 'tab' + (i === currentIndex ? ' active' : ''), ex.emoji + ' ' + ex.name);
    b.type = 'button';
    b.addEventListener('click', () => {
      currentIndex = i;
      renderTabs();
      renderExam();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    tabsEl.appendChild(b);
  });
}

function renderOptions(container, options, exam){
  const box = el('div', 'opts');
  options.forEach((opt, i) => {
    const row = el('div', 'opt');
    const lbl = el('span', 'lbl', (LABELS[i] || '') + '.');
    const txt = el('span', 'opt-text', opt);

    const isSingleLatin = /^[A-Za-z]{1,2}$/.test(opt.trim());
    if(exam.skipLetterRead && isSingleLatin){
      txt.classList.add('tts', 'nospeak');
      txt.setAttribute('title', 'ตัวอักษรเดี่ยวในวิชาภาษาอังกฤษ ระบบจะไม่อ่านออกเสียง');
    } else {
      makeTTS(txt, opt);
    }

    row.appendChild(lbl);
    row.appendChild(txt);
    box.appendChild(row);
  });
  container.appendChild(box);
}

  const exam = EXAMS[currentIndex];

  const title = el('h2', 'subject-title tts', exam.emoji + ' วิชา' + exam.name);

  title.setAttribute('title', 'แตะเพื่อฟังชื่อวิชา');
  contentEl.appendChild(title);

  const desc = el('p', 'subject-desc tts');
  const descText = exam.skipLetterRead
    ? 'แตะที่ประโยค คำถาม หรือคำชี้แจงใดก็ได้เพื่อฟังเสียงอ่าน (ตัวเลือกที่เป็นตัวอักษรภาษาอังกฤษเดี่ยว ระบบจะไม่อ่านออกเสียง)'
    : 'แตะที่ประโยค คำถาม คำชี้แจง หรือตัวเลือกใดก็ได้เพื่อฟังเสียงอ่าน';
  desc.textContent = '👆 ' + descText;
  desc.setAttribute('data-speak', descText);
  contentEl.appendChild(desc);

  exam.sections.forEach(sec => {
    const sectionEl = el('section', 'section');

    // คำชี้แจง / หัวข้อตอน — ทำให้กดฟังได้
    const sectionTitle = el('h3', 'section-title tts', sec.title);
    sectionTitle.setAttribute('data-speak', sec.title);
    sectionTitle.setAttribute('title', 'แตะเพื่อฟังคำชี้แจง');
    sectionEl.appendChild(sectionTitle);

    // อ่านเนื้อเรื่อง
    if(sec.type === 'reading' && sec.passage){
      const box = el('div', 'passage');
      const pt = el('div', 'passage-title tts', sec.passageTitle || 'อ่านเรื่อง');
      pt.setAttribute('data-speak', sec.passageTitle || 'อ่านเรื่อง');
      box.appendChild(pt);

      const p = el('p', 'passage-text');
      const s = el('span', '', sec.passage);
      makeTTS(s, sec.passage);
      p.appendChild(s);
      box.appendChild(p);
      sectionEl.appendChild(box);
    }

    // ข้อความทั่วไป
    if(sec.type === 'plain' && sec.lines){
      sec.lines.forEach(line => {
        const p = el('p', 'plain-line');
        const s = el('span', '', line);
        makeTTS(s, line);
        p.appendChild(s);
        sectionEl.appendChild(p);
      });
    }

    // ข้อสอบแบบจับคู่ (Matching)
    if(sec.type === 'matching' && sec.pairs){
      const grid = el('div', 'matching-grid');
      const leftCol = el('div', 'match-col');
      const rightCol = el('div', 'match-col');

      sec.pairs.forEach((pair, i) => {
        const leftItem = el('div', 'match-item');
        leftItem.appendChild(el('span', 'match-num', (i + 1) + '.'));
        const wordSpan = el('span', '', pair.en);
        makeTTS(wordSpan, pair.en);
        leftItem.appendChild(wordSpan);
        leftCol.appendChild(leftItem);

        const rightItem = el('div', 'match-item');
        const imgSpan = el('div', 'match-img', pair.img);
        rightItem.appendChild(imgSpan);
        rightCol.appendChild(rightItem);
      });

      grid.appendChild(leftCol);
      grid.appendChild(rightCol);
      sectionEl.appendChild(grid);

      const hint = el('p', 'subject-desc', '💡 หมายเหตุ: รูปภาพเป็นเพียงสัญลักษณ์จำลอง นักเรียนสามารถจับคู่ตามคำศัพท์ที่กำหนดให้');
      hint.style.marginTop = '12px';
      sectionEl.appendChild(hint);
    }

    // ข้อสอบแบบคลังคำศัพท์ (Word Bank)
    if(sec.type === 'wordbank' && sec.words){
      if(sec.instruction){
        const inst = el('p', 'plain-line');
        const s = el('span', '', sec.instruction);
        makeTTS(s, sec.instruction);
        inst.appendChild(s);
        sectionEl.appendChild(inst);
      }

      const bank = el('div', 'wordbank-container');
      sec.words.forEach(word => {
        const chip = el('div', 'word-chip', word);
        makeTTS(chip, word);
        bank.appendChild(chip);
      });
      sectionEl.appendChild(bank);
    }

    // รายการข้อสอบ (MC / TF / Open)
    if(sec.items && sec.items.length){
      sec.items.forEach((item, idx) => {
        const card = el('div', 'item');
        const head = el('div', 'item-head');
        head.appendChild(el('span', 'num', (idx + 1) + '.'));

        const txt = el('span', 'item-text', item.text);
        const questionSpeech = 'ข้อ ' + (idx + 1) + ' ' + item.text;
        makeTTS(txt, questionSpeech);
        head.appendChild(txt);

        if(sec.type === 'tf'){
          head.appendChild(el('span', 'tf-mark', '✓ / ✗'));
        }

        const playAllBtn = el('button', 'play-all', '🔊 ฟังทั้งข้อ');
        playAllBtn.type = 'button';
        playAllBtn.setAttribute('title', 'ฟังคำถามและตัวเลือกทั้งหมด');
        playAllBtn.addEventListener('click', function(ev){
          ev.stopPropagation();
          const fullText = buildFullQuestionText(item, idx, exam, sec.type);
          speak(fullText, playAllBtn);
          playAllBtn.classList.add('speaking');
          setTimeout(() => playAllBtn.classList.remove('speaking'), 300);
        });
        head.appendChild(playAllBtn);

        card.appendChild(head);

        if(item.options && item.options.length){
          renderOptions(card, item.options, exam);
        }

        sectionEl.appendChild(card);
      });
    }

    contentEl.appendChild(sectionEl);
  });
}

/* =========================================================
   Event: แตะเพื่ออ่าน
   ========================================================= */
document.addEventListener('click', function(e){
  const target = e.target.closest('.tts');
  if(!target) return;

  if(target.classList.contains('nospeak')){
    showToast('🔇 ข้อนี้เป็นตัวอักษรภาษาอังกฤษเดี่ยว ระบบไม่อ่านออกเสียง');
    return;
  }

  const text = target.getAttribute('data-speak');
  if(!text) return;
  speak(text, target);
});

/* =========================================================
   Header TTS
   ========================================================= */
function initHeaderTTS(){
  const h1 = document.getElementById('headerTitle');
  const h2 = document.getElementById('headerSub');
  makeTTS(h1, h1.textContent);
  makeTTS(h2, 'โรงเรียนบ้านถิ่นสำราญ ชั้นประถมศึกษาปีที่ 2 แตะที่ข้อความใดก็ได้เพื่อฟังเสียงอ่าน');
}

/* =========================================================
   ปุ่มควบคุม
   ========================================================= */
document.getElementById('stopBtn').addEventListener('click', function(){
  stopSpeaking();
});

document.getElementById('rateSel').addEventListener('change', function(e){
  currentRate = parseFloat(e.target.value) || 1;
});

/* =========================================================
   เริ่มต้น
   ========================================================= */
function init(){
  initHeaderTTS();
  renderTabs();
  renderExam();

  // โหลดรายการเสียงหลายรอบ — บางเบราว์เซอร์ (โดยเฉพาะ Chrome) จะโหลดเสียงเสร็จช้า
  refreshVoices();
  if(synth){
    if(typeof synth.onvoiceschanged !== 'undefined'){
      synth.onvoiceschanged = refreshVoices;
    }
    // ลองเช็คซ้ำหลายรอบให้แน่ใจว่าโหลดเสียงครบแล้ว
    setTimeout(refreshVoices, 200);
    setTimeout(refreshVoices, 600);
    setTimeout(refreshVoices, 1200);
    setTimeout(refreshVoices, 2500);
    // ลอง warm-up speech engine ให้พร้อมใช้
    try {
      const warm = new SpeechSynthesisUtterance('');
      warm.volume = 0;
      synth.speak(warm);
    } catch(e){}
  }
  window.addEventListener('beforeunload', stopSpeaking);
}

init();
</script>
